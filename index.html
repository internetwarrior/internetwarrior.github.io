<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA VI — Обратный отсчёт</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: white;
        background:
          linear-gradient(rgba(10, 5, 20, 0.55), rgba(10, 5, 20, 0.85)),
          url("https://4kwallpapers.com/images/wallpapers/gta-6-official-2670x1878-13626.jpg")
            center/cover no-repeat;
        background-color: #100c20;
      }

      .container {
        width: 90%;
        max-width: 850px;
        text-align: center;
        padding: 40px 20px;
      }

      .subtitle {
        color: #ff70c5;
        letter-spacing: 5px;
        font-size: 13px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(65px, 12vw, 120px);
        font-weight: 900;
        letter-spacing: -5px;
        line-height: 1;
        background: linear-gradient(90deg, #ff65c8, #ffb86c, #8d79ff);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 25px #ff65c866);
      }

      .release-date {
        font-size: 20px;
        letter-spacing: 3px;
        margin-top: 25px;
        color: #ffffffcc;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-top: 55px;
      }

      .time-box {
        padding: 25px 10px;
        background: #ffffff0d;
        border: 1px solid #ffffff25;
        border-radius: 12px;
        backdrop-filter: blur(12px);
      }

      .number {
        font-size: clamp(35px, 7vw, 65px);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .label {
        margin-top: 10px;
        font-size: 11px;
        color: #ff8bcf;
        letter-spacing: 2px;
      }

      .footer {
        margin-top: 45px;
        color: #ffffff80;
        font-size: 12px;
        letter-spacing: 2px;
      }

      @media (max-width: 500px) {
        .countdown {
          gap: 7px;
        }

        .time-box {
          padding: 20px 5px;
        }

        .label {
          font-size: 9px;
          letter-spacing: 0;
        }

        .release-date {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="subtitle"></div>

      <h1>GTA VI</h1>

      <div class="release-date">19 НОЯБРЯ 2026</div>

      <div class="countdown">
        <div class="time-box">
          <div class="number" id="days">00</div>
          <div class="label">ДНЕЙ</div>
        </div>

        <div class="time-box">
          <div class="number" id="hours">00</div>
          <div class="label">ЧАСОВ</div>
        </div>

        <div class="time-box">
          <div class="number" id="minutes">00</div>
          <div class="label">МИНУТ</div>
        </div>

        <div class="time-box">
          <div class="number" id="seconds">00</div>
          <div class="label">СЕКУНД</div>
        </div>
      </div>

      <div class="footer" id="status">ОЖИДАНИЕ СКОРО ЗАКОНЧИТСЯ</div>
    </main>

    <script>
      // 19 ноября 2026 года, 00:00 по местному времени
      const releaseDate = new Date(2026, 10, 19, 0, 0, 0);

      const elements = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        status: document.getElementById("status"),
      };

      function updateCountdown() {
        const now = new Date();
        const difference = releaseDate.getTime() - now.getTime();

        if (difference <= 0) {
          elements.days.textContent = "00";
          elements.hours.textContent = "00";
          elements.minutes.textContent = "00";
          elements.seconds.textContent = "00";

          elements.status.textContent = "GTA VI УЖЕ ВЫШЛА!";
          clearInterval(timer);
          return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));

        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);

        const minutes = Math.floor((difference / (1000 * 60)) % 60);

        const seconds = Math.floor((difference / 1000) % 60);

        elements.days.textContent = String(days).padStart(2, "0");
        elements.hours.textContent = String(hours).padStart(2, "0");
        elements.minutes.textContent = String(minutes).padStart(2, "0");
        elements.seconds.textContent = String(seconds).padStart(2, "0");
      }

      updateCountdown();

      const timer = setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
