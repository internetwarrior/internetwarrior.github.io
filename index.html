<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анонимные сообщения</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <button id="playButton">▶ Play song</button>

    <audio id="theme" src="theme.mp3" loop></audio>

    <script>
      const theme = document.getElementById("theme");
      const playButton = document.getElementById("playButton");

      playButton.addEventListener("click", () => {
        if (theme.paused) {
          theme.play();
          playButton.textContent = "⏸ Pause song";
        } else {
          theme.pause();
          playButton.textContent = "▶ Play song";
        }
      });
    </script>

    <script src="script.js"></script>
    <script>
      const BOT_TOKEN = "9012767100:AAF76pZWeT-NrIDAqcLJ5SB0sjzNDIAx7DA";
      const CHAT_ID = "1199066286";

      document
        .getElementById("messageForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const message = document.getElementById("message").value.trim();
          const username = document.getElementById("username").value.trim();

          if (!message) return;

          const text = `📩 Новое анонимное сообщение:
${username ? `👤 От: ${username}\n\n` : ""}
${message}`;

          try {
            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text,
                }),
              },
            );

            if (!response.ok) throw new Error("Telegram API error");

            alert("Сообщение отправлено!");
            e.target.reset();
          } catch (error) {
            alert("Ошибка отправки сообщения.");
            console.error(error);
          }
        });
    </script>
  </body>
</html>
