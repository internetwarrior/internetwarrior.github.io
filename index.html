<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анонимные сообщения</title>
  </head>
  <body>
    <h1>Внимание!</h1>
    <div>
      Я могу только получать сообщения! Отвечать не смогу. И самое главное: если
      хотите выйти на контакт, пишите сразу в
      <span>
        <a target="_blank" href="https://t.me/lnternetWarrior">Мой телеграм</a>
      </span>
    </div>
    <br />
    <form id="messageForm" style="width: 100%; max-width: 500px">
      <input
        type="text"
        name="username"
        id="username"
        placeholder="Кто ты? Подсказка, Ник"
      />
      <br />
      <br />
      <textarea
        id="message"
        placeholder="Анонимное сообщение"
        required
        style="width: 100%; height: 150px; box-sizing: border-box"
      ></textarea>
      <br />
      <button type="submit">Отправить</button>
    </form>
    <script>
      const BOT_TOKEN = "9012767100:AAF76pZWeT-NrIDAqcLJ5SB0sjzNDIAx7DA";
      const CHAT_ID = "1199066286";

      document
        .getElementById("messageForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const message = document.getElementById("message").value.trim();
          const username = document.getElementById("username").value.trim();

          if (!message) return;

          const text = `📩 Новое анонимное сообщение:
${username ? `👤 От: ${username}\n\n` : ""}
${message}`;

          try {
            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text,
                }),
              },
            );

            if (!response.ok) throw new Error("Telegram API error");

            alert("Сообщение отправлено!");
            e.target.reset();
          } catch (error) {
            alert("Ошибка отправки сообщения.");
            console.error(error);
          }
        });
    </script>
  </body>
</html>
